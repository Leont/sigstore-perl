name    = Sigstore-Perl
author  = Leon Timmermans <fawaka@gmail.com>
license = Apache_2_0
copyright_holder = Leon Timmermans
copyright_year   = 2026

[Git::GatherDir]
[PruneCruft]
[MetaYAML]
[License]
[Manifest]
[Readme]

[AutoPrereqs]
[MetaJSON]
[GitHub::Meta]
[Git::NextVersion]
[MetaProvides::Package]

[MakeMaker]

[FileFinder::Filter / WeaverFiles]
finder = :InstallModules
skip  = Util

[Test::Compile]
[PodSyntaxTests]
[Test::Pod::Coverage::TrustMe]
finder = WeaverFiles

[InstallGuide]
[PodWeaver]
finder = WeaverFiles
[PkgVersion]
[NextRelease]

[CheckChangesHasContent]
[Git::Check]
[RunExtraTests]
[TestRelease]
[ConfirmRelease]

[MinimumPerl]

[UploadToCPAN]

[Git::Commit]
[Git::Tag]
[Git::Push]
